creed:
 - Ars longa, vita brevis, occasio praeceps, experimentum periculosum, iudicium difficile.

 - Hads — ᾍδης (Háidēs). Eldest son of Cronus; King of the Underworld and lord of the dead and of the riches beneath the earth. His Roman equivalent is Pluto.

 - Thanatos — Θάνατος. Death itself — the twin brother of Hypnos (Sleep), son of Nyx.

 - Hypnos — Ὕπνος. The god of sleep, who dwells in the underworld’s borderlands.

 - Morph — Μορφεύς. God of dreams, who appears to sleepers in human form. Best known from Ovid’s Metamorphoses.

 - Oneiroi — Ὄνειροι. The dark-winged spirits of dreams, children of Nyx.

 - Moros — Μόρος. The embodiment of doom — the inescapable destiny of death; child of Nyxt.

