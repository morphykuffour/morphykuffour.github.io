title: morpheus
# Markup is safe here: the homepage h1 is the only thing that renders it.
# The first three epithets point at where they come from: the lift, the
# Wu-Tang bar (Method Man opens GZA's "Shadowboxin'" with "the head toucher,
# industry party bum rusher"), and the physics of bending a shadow. The last
# one names the colour dial sitting above it, so it stands on its own.
tagline: <a href="https://barbend.com/skull-crushers/">skull crusher</a>, <a href="https://en.wikipedia.org/wiki/Shadowboxin%27">head toucher</a>, <a href="https://www.pa.uky.edu/sciworks/xtra/shy.htm">shadow bender</a>, mind wiper
author: Morphy Kuffour
description: >-
 Psalm 91:2, nixos, arch, security, qmk, zmk, vim, emacs, neovim, scripting, keyboards, programming

# Sits under the description as its own line on the homepage. The list above
# says what the interests are; this says what they are all in service of.
creed: I have a passion for solving extremely difficult problems
creed: I'm a nightmare dressed like a daydream - Taylor Swift - Blank Space

# baseurl: "" # the subpath of your site, e.g. /blog
domain: morphykuffour.github.io
url: https://morphykuffour.github.io
github_username: morph-k

# The theme's head renders this as the tab icon. It is the same portrait the
# homepage shows beside the alias, kept here as a local copy so the tab does
# not depend on avatars.githubusercontent.com being reachable.
favicon: /images/avatar.png

remote_theme: riggraz/no-style-please

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize text for homepage link
  date_format: "%Y-%m-%d"
  show_description: true # show blog description in homepage
  show_lastmod: false
  show_categories: true
  lowercase_titles: false

sass:
  style: compressed

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
