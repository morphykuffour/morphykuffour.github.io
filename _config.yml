title: morpheus
# Markup is safe here: the homepage h1 is the only thing that renders it.
# Each epithet points at where it comes from: the lift, the Wu-Tang bar
# (Method Man opens GZA's "Shadowboxin'" with "the head toucher, industry
# party bum rusher"), and the physics of bending a shadow.
tagline: <a href="https://barbend.com/skull-crushers/">skull crusher</a>, <a href="https://en.wikipedia.org/wiki/Shadowboxin%27">head toucher</a>, <a href="https://www.pa.uky.edu/sciworks/xtra/shy.htm">shadow bender</a>
author: Morphy Kuffour
description: >-
 Psalm 91:2 , nixos, arch, security, qmk, zmk, vim, emacs, neovim, scripting, keyboards, programming, 101,707, 070, "ain't no legroom in the casket" - MEEK MILL | FUNK FLEX | #Freestyle118

# baseurl: "" # the subpath of your site, e.g. /blog
domain: morphykuffour.github.io
url: https://morphykuffour.github.io
github_username: morph-k

# The theme's head renders this as the tab icon. It is the same portrait the
# homepage shows beside the alias, kept here as a local copy so the tab does
# not depend on avatars.githubusercontent.com being reachable.
favicon: /images/avatar.png

remote_theme: riggraz/no-style-please

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize text for homepage link
  date_format: "%Y-%m-%d"
  show_description: true # show blog description in homepage
  show_lastmod: false
  show_categories: true
  lowercase_titles: false

sass:
  style: compressed

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
