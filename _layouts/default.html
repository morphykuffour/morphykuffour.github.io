<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}">
  {%- include head.html -%}
  <body a="{{ site.theme_config.appearance | default: "auto" }}">
    <script>
      // Runs before the content paints, so a stored preference never flashes
      // the wrong way. The theme drives its whole light/dark switch off this
      // one attribute on <body>.
      (function () {
        try {
          var saved = localStorage.getItem('appearance');
          if (saved === 'light' || saved === 'purple' || saved === 'dark') {
            document.body.setAttribute('a', saved);
          }
        } catch (e) { /* private mode: fall through to the theme default */ }
      })();
    </script>

    <main class="page-content" aria-label="Content">
      <div class="w">
        <div class="theme-slider">
          <div class="theme-slider__panel">
            <input class="theme-slider__range" type="range"
                   min="0" max="2" step="1" value="0"
                   aria-label="Colour theme" aria-valuetext="light">
            <div class="theme-slider__marks" aria-hidden="true">
              <span>light</span>
              <span>purple</span>
              <span>dark</span>
            </div>
          </div>
        </div>

        {{ content }}
      </div>
    </main>

    <script>
      (function () {
        var body = document.body;
        var range = document.querySelector('.theme-slider__range');
        var marks = document.querySelectorAll('.theme-slider__marks span');
        // Left-to-right along the dial; the index is the slider's value.
        var ORDER = ['light', 'purple', 'dark'];

        // With no stored choice the theme stays on "auto", so reflect whichever
        // mode the OS is actually resolving to rather than parking at one end.
        function current() {
          var a = body.getAttribute('a');
          if (ORDER.indexOf(a) !== -1) return a;
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function sync() {
          var now = current();
          var i = ORDER.indexOf(now);
          range.value = String(i);
          // Otherwise a screen reader announces the bare index.
          range.setAttribute('aria-valuetext', now);
          marks.forEach(function (m, j) {
            m.classList.toggle('is-on', j === i);
          });
        }

        // `input` rather than `change`, so dragging repaints as it passes each
        // detent instead of only on release.
        range.addEventListener('input', function () {
          var choice = ORDER[Number(range.value)] || 'light';
          body.setAttribute('a', choice);
          try { localStorage.setItem('appearance', choice); } catch (e) {}
          sync();
        });

        // Keep the pressed state honest if the OS flips while on "auto".
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', sync);

        sync();
      })();
    </script>

    {%-if site.goat_counter and jekyll.environment == "production"-%}
      {%-include goat_counter.html-%}
    {%-endif-%}

    {% if page.custom_js %}
      {% for js_file in page.custom_js %}
        <script type="text/javascript" src="{{ site.baseurl }}/assets/js/{{ js_file }}.js"></script>
      {% endfor %}
    {% endif %}
  </body>
</html>
