entries:
  - title: përi
    url: /about/

  - title: art
    url: /art/

  - title: xkcd
    url: /xkcd/

  - title: unc
    url: /unc/

  - title: music
    url: /music/

  - title: honors thesis
    url: /thesis/

  - title: posts
    post_list:
      # No limit and no "see all" link: the homepage lists every post itself.
      show_more: false

  - title: elsewhere
    # The second stack, floated beside this sub-list. It hangs off the entry
    # rather than off the layout because a float only moves what comes after it
    # in the source, and only _includes/menu_item.html gets to write anything
    # between an entry and its own children.
    cascade:
      file: dragon
      width: 480
      height: 480
      label: A dragon over a burning castle at night, in black and white.
    # Each icon: names a file in _includes/icons. It is drawn in currentColor
    # at 1em, so it follows the link colour of whichever mode is on.
    entries:
      - title: github
        url: https://github.com/morph-k
        icon: github
      - title: linkedin
        url: https://www.linkedin.com/in/morphy-kuffour/
        icon: linkedin
      - title: website
        url: https://morphykuffour.com
        icon: website
      - title: resume
        url: /resume/
        icon: resume
      - title: rss
        url: /feed.xml
        icon: rss
      - title: reddit
        url: https://www.reddit.com/user/JediMasterMorphy/
        icon: reddit
      - title: instagram
        url: https://www.instagram.com/morp.k/
        icon: instagram
      - title: pinterest
        url: https://www.pinterest.com/morphykuffour/
        icon: pinterest
