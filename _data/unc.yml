# The five photographs behind /unc/, in the order they are shown. Written by
# hand, unlike _data/art.yml -- there is no script for this one, because the
# source is a camera roll rather than an API.
#
# `caption` is what appears under the picture; `alt` is what is read out in
# place of it. They are deliberately different: a caption is a remark about a
# photo you can already see, and an alt is a description of one you cannot.

- file: 'under-the-oak.jpg'
  width: 1006
  height: 1353
  caption: 'shade, borrowed from an oak'
  alt: 'Close selfie shot from below, sunlit, against an oak canopy and blue sky.'

- file: 'husky-hoodie.jpg'
  width: 762
  height: 1353
  caption: 'husky on the chest, sunglasses indoors'
  alt: 'Selfie indoors in sunglasses and a grey UConn husky hoodie.'

- file: 'ray-bans.jpg'
  width: 1006
  height: 1353
  caption: 'the clouds doing most of the work'
  alt: 'Selfie in Ray-Bans under a concrete stair, cumulus clouds filling the rest of the frame.'

- file: 'kitchen-kit.jpg'
  width: 560
  height: 1001
  caption: 'full kit, glass of milk, no match on'
  alt: 'Standing in a kitchen drinking a glass of milk, wearing a red Bayern Munich kit.'

- file: 'catacombs.jpg'
  width: 1006
  height: 1353
  caption: 'a passage about one person wide'
  alt: 'Standing in a narrow vaulted stone passage, another visitor on the steps behind.'

# The anime one is drawn rather than taken, which is why it says so in the
# caption: on a page of photographs an unlabelled render is a small lie.
# It arrived as a screenshot with this site's own theme slider sitting over
# the car, so it is cropped to the 750 rows above that.
- file: 'anime-uconn.jpg'
  width: 893
  height: 750
  caption: 'the anime version, UConn polo and all'
  alt: 'Anime-style illustration of me standing in front of a red Subaru in a navy UConn polo.'

- file: 'check-scarf.jpg'
  width: 994
  height: 1273
  caption: 'blurred, but the scarf came through'
  alt: 'Motion-blurred selfie in a dark coat and a beige check scarf.'

- file: 'wine-and-headphones.jpg'
  width: 755
  height: 1121
  caption: 'hood up, headphones on, one glass in'
  alt: 'Selfie in a green hooded sweatshirt and wired over-ear headphones, holding a glass of red wine.'

- file: 'burger.jpg'
  width: 971
  height: 1090
  caption: 'a burger that wanted both hands'
  alt: 'Sitting at a restaurant table by the window, holding a burger with both hands over a plate of salad.'
