# The frieze under the rain on the homepage: ten pictures saved off other
# people's feeds, set to one height and run past the page in a single endless
# strip. Where they came from is not recorded and the makers are not known
# here, so the caption under the strip claims nothing about either -- see
# index.markdown, where that decision is written out.
#
# The dimensions are here because the widths differ, picture by picture, and a
# lazy image without its own size reserves the wrong box and shifts the strip
# when it lands. Order is the order they were handed over.

