# Hand-kept, unlike _data/music.yml: tracks put on the page directly rather
# than picked up from the watch history. They live in a second file because
# scripts/youtube-music.py rewrites music.yml wholesale on every run, so an
# entry added to it by hand survives until the next update and no longer.
#
# Same shape as music.yml. These sit at the top of the grid, and /music/ skips
# a pulled entry pointing at the same video so a track added here does not
# appear twice once the history catches up with it.

