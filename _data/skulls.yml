# The skulls under the rain on the homepage: sixteen studies of one skull by
# Jeff Searle (https://jeffsearle.blogspot.co.uk/), sliced out of a single
# sheet of his. Cut on the gutters between the drawings rather than on an even
# grid -- he drew them where they fit, not to a ruler -- then trimmed to the
# ink and set to one height, so a roll of them keeps a steady line.
#
# The dimensions are here because the widths differ, drawing by drawing, and a
# lazy image without its own size reserves the wrong box and shifts the strip
# when it lands. Order is the order they were read off the sheet.

